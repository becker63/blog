name: Automation Check
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v15
        if: ${{ env.CACHIX_AUTH_TOKEN != '' }}
        with:
          name: ${{ vars.CACHIX_CACHE_NAME || 'becker63' }}
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}
      - run: nix develop --command bun install --frozen-lockfile
      - run: nix develop --command bunx nx run automation:check-workflows
      - run: nix develop --command bunx nx run workspace:actionlint
      - run: nix develop --command bunx nx run workspace:typecheck
      - run: nix develop --command bunx nx run automation:insight-test
      - run: nix develop --command bunx nx run automation:insight-check
      - run: nix develop --command bunx nx run workspace:lint
